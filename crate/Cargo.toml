[package]
name = "halo-filmshell-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
filmshell = { git = "https://github.com/OpenSpartan/libfilmshell", rev = "031e2179f0758314e2a97fb96438c7b1e82ce1fb", features = ["serde", "research"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"