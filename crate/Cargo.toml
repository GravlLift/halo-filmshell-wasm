[package]
name = "halo-filmshell-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
filmshell = { git = "https://github.com/OpenSpartan/libfilmshell", rev = "8f0f8d078e513c800baa21fac416fd4c0c127d03", features = ["serde", "research"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"